<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tonnage</title>

<!-- VERSION APP -->
<meta name="app-version" content="1.0.0">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#000;
  color:#fff;
  padding:16px;
}

h1{
  text-align:center;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:18px;
  margin:8px 0;
  font-size:22px;
  border-radius:10px;
  border:none;
}

#area{
  text-align:center;
  font-size:26px;
  opacity:0.85;
  margin-top:10px;
}

#t{
  font-size:70px;
  text-align:center;
  margin-top:20px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:28px;
  opacity:0.7;
  margin-top:5px;
}
</style>
</head>

<body>

<h1>Tonnage</h1>

<input id="L" type="number" inputmode="decimal" placeholder="Longueur (m)">
<input id="l" type="number" inputmode="decimal" placeholder="Largeur (m)">
<input id="e" type="number" inputmode="numeric" placeholder="Épaisseur (cm)">
<input id="q" type="number" inputmode="numeric" value="1" placeholder="Quantité">

<div id="area">0 m²</div>
<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<script>
function calc(){

  const L = Number(document.getElementById('L').value) || 0;
  const l = Number(document.getElementById('l').value) || 0;
  const e = Number(document.getElementById('e').value) || 0;
  const q = Number(document.getElementById('q').value) || 1;

  const surface = L * l;
  const tonnage = L * l * (e / 100) * 2.7 * q;
  const kg = tonnage * 1000;

  document.getElementById('area').textContent =
    surface.toFixed(2) + " m²";

  document.getElementById('t').textContent =
    tonnage.toFixed(2) + " t";

  document.getElementById('kg').textContent =
    Math.round(kg).toLocaleString() + " kg";
}

// auto calcul
document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("input", calc);
});
window.addEventListener("load", calc);


/* 🔥 AUTO UPDATE POUR ICÔNE iPhone */
(function () {

  const CURRENT_VERSION = "1.0.0";
  const savedVersion = localStorage.getItem("app_version");

  if (!savedVersion) {
    localStorage.setItem("app_version", CURRENT_VERSION);
    return;
  }

  if (savedVersion !== CURRENT_VERSION) {
    localStorage.setItem("app_version", CURRENT_VERSION);
    location.reload();
  }

})();
</script>

</body>
</html>
