<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tonnage m³</title>
<meta name="app-version" content="1.0.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tonnage m³">
<link rel="apple-touch-icon" href="icon.png">

<style>
html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  font-family: Arial;
  background:#000;
  color:#fff;
}

body{
  padding:10px;
}

h1{
  text-align:center;
  margin:10px 0;
  font-size:22px;
}

label{
  font-size:16px;
  opacity:0.8;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0 14px 0;
  font-size:20px;
  border-radius:8px;
  border:none;
  outline:none;
}

#t{
  font-size:48px;
  text-align:center;
  margin-top:20px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}

#version{
  text-align:center;
  font-size:12px;
  opacity:0.4;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>TONNAGE m³</h1>

<label>Volume (m³)</label>
<input id="v" type="text" inputmode="decimal" placeholder="Ex : 1.25">

<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<div id="version"></div>

<script>
function calc(){
  const v = parseFloat(document.getElementById('v').value.replace(",", ".")) || 0;

  const tonnage = v * 2.7;
  const kg = tonnage * 1000;

  document.getElementById('t').textContent = tonnage.toFixed(2) + " t";
  document.getElementById('kg').textContent = Math.round(kg).toLocaleString() + " kg";
}

document.getElementById("v").addEventListener("input", calc);

window.addEventListener("load", calc);

document.getElementById("version").textContent =
  "Version " + document.querySelector('meta[name=\"app-version\"]').content;

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
