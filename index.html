<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tonnage m³</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tonnage m³">
<link rel="apple-touch-icon" href="icon.png">

<style>
html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  font-family: Arial;
  background:#000;
  color:#fff;
}

body{
  padding:10px;
}

h1{
  text-align:center;
  margin:10px 0;
  font-size:22px;
}

label{
  font-size:16px;
  opacity:0.8;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0 14px 0;
  font-size:20px;
  border-radius:8px;
  border:none;
  outline:none;
}

#t{
  font-size:48px;
  text-align:center;
  margin-top:20px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}

a{
  color:#00ff99;
  text-decoration:none;
  display:block;
  text-align:center;
  margin-top:20px;
  font-size:18px;
}

footer{
  text-align:center;
  opacity:0.6;
  font-size:12px;
  margin-top:30px;
}
</style>
</head>

<body>

<h1>TONNAGE m³</h1>

<label>Volume (m³)</label>
<input id="v" type="text" inputmode="decimal" placeholder="Ex : 1.25">

<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<!-- Bouton vers la page multi -->
<a href="multi.html">➕ Mode multi m³</a>

<!-- Bouton mise à jour -->
<a href="#" onclick="updateApp()">🔄 Mettre à jour l’application</a>

<!-- Footer version -->
<footer>
  Version : <span id="app-version"></span>
</footer>

<script>
// Version globale
const APP_VERSION = "1.0.2";

// Affichage version
window.addEventListener("DOMContentLoaded", () => {
  const v = document.getElementById("app-version");
  if (v) v.textContent = APP_VERSION;
});

// Calcul tonnage
function calc(){
  const v = parseFloat(document.getElementById('v').value.replace(",", ".")) || 0;

  const tonnage = v * 2.7;
  const kg = tonnage * 1000;

  document.getElementById('t').textContent = tonnage.toFixed(2) + " t";
  document.getElementById('kg').textContent = Math.round(kg).toLocaleString() + " kg";
}

document.getElementById("v").addEventListener("input", calc);
window.addEventListener("load", calc);

// 🔄 Mise à jour PWA
function updateApp(){
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) {
        reg.update();
        alert("Mise à jour demandée.\nRouvrez l’app dans 2 secondes.");
      }
    });
  }
}

// Enregistrement SW
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

// Reload auto après update
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    location.reload();
  });
}
</script>

</body>
</html>
