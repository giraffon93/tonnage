<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multi m³</title>

<style>
html, body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  font-family: Arial;
  background:#000;
  color:#fff;
}

body{
  padding:10px;
}

h1{
  text-align:center;
  margin:10px 0;
  font-size:22px;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input{
  flex:1;
  padding:12px;
  font-size:20px;
  border-radius:8px;
  border:none;
  outline:none;
}

button{
  padding:12px 14px;
  font-size:20px;
  border:none;
  border-radius:8px;
  background:#00ff99;
  color:#000;
  font-weight:bold;
}

#total{
  margin-top:20px;
  text-align:center;
  font-size:40px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}

a{
  color:#00ff99;
  text-decoration:none;
  display:block;
  text-align:center;
  margin-top:20px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>MODE MULTI m³</h1>

<div id="list"></div>

<button onclick="addRow()">+ Ajouter m³</button>

<div id="total">0.00 t</div>
<div id="kg">0 kg</div>

<a href="index.html">⬅ Retour</a>

<script>
function addRow(){
  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <input type="number" step="0.01" placeholder="m³" oninput="calc()">
    <button onclick="this.parentNode.remove(); calc()">X</button>
  `;

  document.getElementById("list").appendChild(div);
}

function calc(){
  let total = 0;

  document.querySelectorAll("#list input").forEach(input => {
    const v = parseFloat(input.value.replace(",", ".")) || 0;
    total += v * 2.7;
  });

  document.getElementById("total").textContent = total.toFixed(2) + " t";
  document.getElementById("kg").textContent = Math.round(total * 1000).toLocaleString() + " kg";
}
</script>

</body>
</html>
