<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M² multi</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:15px;
}

h1{
  text-align:center;
}

/* Ligne identique au M³ multi */
.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  align-items:center;
}

/* Inputs identiques */
input{
  flex:1;
  padding:10px;
  font-size:18px;
  border-radius:8px;
  border:none;
}

/* Résultat identique à .lineWeight */
.lineWeight{
  flex:0 0 auto;
  min-width:75px;
  text-align:right;
  color:#00ff99;
  font-size:18px;
  font-weight:bold;
}

/* Boutons identiques */
button{
  padding:10px 14px;
  font-size:18px;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

/* Ajouter */
.btn-add {
  background:#00ff99;
  color:#000;
  width:100%;
  margin-bottom:10px;
}

/* Ligne des deux boutons */
.actions {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

/* Sauvegarder */
.btn-save {
  background:#00ff99;
  color:#000;
  flex:1;
}

/* Effacer tout */
.btn-clear {
  background:#ff4d4d;
  color:#fff;
  flex:1;
}

/* Totaux */
#total{
  margin-top:20px;
  text-align:center;
  font-size:28px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:20px;
  opacity:0.7;
}

a{
  color:#00ff99;
  text-decoration:none;
  display:block;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>M² multi</h1>

<div id="list"></div>

<button class="btn-add" onclick="addRow()">+ Ajouter m²</button>

<div class="actions">
  <button class="btn-save" onclick="saveData()">💾 Sauvegarder</button>
  <button class="btn-clear" onclick="clearAll()">🗑 Effacer tout</button>
</div>

<div id="total">0.000 T</div>
<div id="kg">0 kg</div>

<a href="index.html">⬅ Retour</a>

<script>
function addRow(m2="", ep=""){
  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <input type="text" inputmode="decimal" placeholder="m²" class="m2" value="${m2}" oninput="calc(); saveData()">
    <input type="text" inputmode="decimal" placeholder="Ép. (cm)" class="ep" value="${ep}" oninput="calc(); saveData()">
    <span class="lineWeight">0.000 T</span>
    <button onclick="removeRow(this)" style="background:#00ff99; color:#000;">X</button>
  `;

  document.getElementById("list").appendChild(div);
  calc();
}

function removeRow(btn){
  const rows = document.querySelectorAll(".row");
  if (rows.length > 1){
    btn.parentNode.remove();
    calc();
    saveData();
  }
}

function calc(){
  let total = 0;

  document.querySelectorAll(".row").forEach(row=>{
    const m2 = parseFloat(row.querySelector(".m2").value.replace(",", ".")) || 0;
    const ep = parseFloat(row.querySelector(".ep").value.replace(",", ".")) || 0;

    const volume = m2 * (ep / 100);
    const tonnes = volume * 2.7;

    row.querySelector(".lineWeight").textContent = tonnes.toFixed(3) + " T";

    total += tonnes;
  });

  document.getElementById("total").textContent = total.toFixed(3) + " T";
  document.getElementById("kg").textContent = Math.round(total * 1000).toLocaleString() + " kg";
}

function saveData(){
  const data = [];
  document.querySelectorAll(".row").forEach(row=>{
    data.push({
      m2: row.querySelector(".m2").value,
      ep: row.querySelector(".ep").value
    });
  });
  localStorage.setItem("m2multi", JSON.stringify(data));
}

function loadData(){
  const saved = JSON.parse(localStorage.getItem("m2multi") || "[]");

  document.getElementById("list").innerHTML = "";

  if (saved.length === 0){
    addRow();
    addRow();
  } else {
    saved.forEach(item => addRow(item.m2, item.ep));
  }

  calc();
}

function clearAll(){
  localStorage.removeItem("m2multi");
  document.getElementById("list").innerHTML = "";
  addRow();
  addRow();
  calc();
}

window.onload = loadData;
</script>

</body>
</html>
