<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M³ multi</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:15px;
}

h1{
  text-align:center;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input{
  flex:1;
  padding:10px;
  font-size:18px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px 14px;
  font-size:18px;
  border:none;
  border-radius:8px;
  background:#00ff99;
  color:#000;
  font-weight:bold;
}

#total{
  margin-top:20px;
  text-align:center;
  font-size:28px;
  color:#00ff99;
  font-weight:bold;
}

a{
  color:#00ff99;
  text-decoration:none;
  display:block;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>M³ multi</h1>

<div id="list"></div>

<button onclick="addRow()">+ Ajouter m³</button>

<div id="total">0.00 t</div>

<a href="index.html">⬅ Retour</a>

<script>
function addRow(){
  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <input type="text" inputmode="decimal" placeholder="m³" oninput="calc()">
    <button onclick="this.parentNode.remove(); calc()">X</button>
  `;

  document.getElementById("list").appendChild(div);
}

function calc(){
  let total = 0;

  document.querySelectorAll("#list input").forEach(input => {
    const v = parseFloat(input.value.replace(",", ".")) || 0;
    total += v * 2.7;
  });

  document.getElementById("total").textContent = total.toFixed(2) + " t";
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

<script src="app.js"></script>

</body>
</html>
