<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M³ multi</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:15px;
}

h1{
  text-align:center;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  align-items:center;
}

input{
  flex:1;
  padding:10px;
  font-size:18px;
  border-radius:8px;
  border:none;
}

/* 🔥 Correction iPhone 16 : largeur flexible */
.lineWeight{
  flex:0 0 auto;
  min-width:55px;
  text-align:right;
  color:#00ff99;
  font-size:18px;
  font-weight:bold;
}

button{
  padding:10px 14px;
  font-size:18px;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

/* Bouton ajouter */
.btn-add {
  background:#00ff99;
  color:#000;
  width:100%;
  margin-bottom:10px;
}

/* Ligne des deux boutons */
.actions {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

/* Sauvegarder */
.btn-save {
  background:#00ff99;
  color:#000;
  flex:1;
}

/* Effacer tout */
.btn-clear {
  background:#ff4d4d;
  color:#fff;
  flex:1;
}

#total{
  margin-top:20px;
  text-align:center;
  font-size:28px;
  color:#00ff99;
  font-weight:bold;
}

a{
  color:#00ff99;
  text-decoration:none;
  display:block;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>M³ multi</h1>

<div id="list"></div>

<button class="btn-add" onclick="addRow()">+ Ajouter m³</button>

<div class="actions">
  <button class="btn-save" onclick="saveData()">💾 Sauvegarder</button>
  <button class="btn-clear" onclick="clearAll()">🗑 Effacer tout</button>
</div>

<div id="total">0.000 T</div>

<a href="index.html">⬅ Retour</a>

<script>
function addRow(value = ""){
  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <input type="text" inputmode="decimal" placeholder="m³" value="${value}"
           oninput="calc(); saveData()">

    <span class="lineWeight">0.000 T</span>

    <button onclick="removeRow(this)" style="background:#00ff99; color:#000;">X</button>
  `;

  document.getElementById("list").appendChild(div);
}

function removeRow(btn){
  const rows = document.querySelectorAll(".row");
  if (rows.length > 1){
    btn.parentNode.remove();
    calc();
    saveData();
  }
}

function calc(){
  let total = 0;

  document.querySelectorAll(".row").forEach(row => {
    const input = row.querySelector("input");
    const span = row.querySelector(".lineWeight");

    const v = parseFloat(input.value.replace(",", ".")) || 0;
    const weight = v * 2.7;

    span.textContent = weight.toFixed(3) + " T";

    total += weight;
  });

  document.getElementById("total").textContent = total.toFixed(3) + " T";
}

function saveData(){
  const values = [];
  document.querySelectorAll("#list input").forEach(input => {
    values.push(input.value);
  });
  localStorage.setItem("multiData", JSON.stringify(values));
}

function loadData(){
  const saved = JSON.parse(localStorage.getItem("multiData") || "[]");

  document.getElementById("list").innerHTML = "";

  if (saved.length === 0){
    addRow("");
    addRow("");
  } else {
    saved.forEach(v => addRow(v));
  }

  calc();
}

function clearAll(){
  localStorage.removeItem("multiData");
  document.getElementById("list").innerHTML = "";

  addRow("");
  addRow("");

  document.getElementById("total").textContent = "0.000 T";
}

window.onload = loadData;

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

<script src="app.js"></script>

</body>
</html>
