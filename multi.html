<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi m³</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:15px;
}

h1{
  text-align:center;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input{
  flex:1;
  padding:10px;
  font-size:18px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px 14px;
  font-size:18px;
  border:none;
  border-radius:8px;
  background:#00ff99;
  color:#000;
  font-weight:bold;
}

#total{
  margin-top:20px;
  text-align:center;
  font-size:28px;
  color:#00ff99;
  font-weight:bold;
}

#version{
  text-align:center;
  font-size:12px;
  opacity:0.4;
  margin-top:10px;
}

a{
  color:#00ff99;
  text-decoration:none;
  display:block;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>Multi m³</h1>

<div id="list"></div>

<button onclick="addRow()">+ Ajouter m³</button>

<div id="total">0.00 t</div>

<div id="version"></div>

<a href="index.html">⬅ Retour</a>
<a href="#" onclick="updateApp()">🔄 Mettre à jour l’application</a>

<script>
function addRow(){
  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <input type="text" inputmode="decimal" placeholder="m³" oninput="calc()">
    <button onclick="this.parentNode.remove(); calc()">X</button>
  `;

  document.getElementById("list").appendChild(div);
}

function calc(){
  let total = 0;

  document.querySelectorAll("#list input").forEach(input => {
    const v = parseFloat(input.value.replace(",", ".")) || 0;
    total += v * 2.7;
  });

  document.getElementById("total").textContent = total.toFixed(2) + " t";
}

// Affichage version
document.getElementById("version").textContent =
  "Version " + document.querySelector('meta[name="app-version"]').content;

// Mise à jour
function updateApp(){
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) {
        reg.update();
        alert("Mise à jour demandée.\nRouvrez l’app dans 2 secondes.");
      }
    });
  }
}

// Auto‑reload
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    location.reload();
  });
}
</script>

</body>
</html>
