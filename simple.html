<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M³ simple</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:20px;
}

h1{
  text-align:center;
  font-size:26px;
}

label{
  font-size:16px;
  opacity:0.8;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0 14px 0;
  font-size:20px;
  border-radius:8px;
  border:none;
  outline:none;
}

#t{
  font-size:48px;
  text-align:center;
  margin-top:20px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}

a{
  color:#00ff99;
  text-decoration:none;
  display:block;
  text-align:center;
  margin-top:20px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>M³ simple</h1>

<label>Volume (m³)</label>
<input id="v" type="text" inputmode="decimal" placeholder="Ex : 1.25">

<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<a href="index.html">⬅ Retour</a>

<script>
function calc(){
  const v = parseFloat(document.getElementById('v').value.replace(",", ".")) || 0;
  const tonnage = v * 2.7;
  const kg = tonnage * 1000;

  document.getElementById('t').textContent = tonnage.toFixed(2) + " t";
  document.getElementById('kg').textContent = Math.round(kg).toLocaleString() + " kg";
}

document.getElementById("v").addEventListener("input", calc);
window.addEventListener("load", calc);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

<script src="app.js"></script>

</body>
</html>
